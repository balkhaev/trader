name: trader-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ${SERVER_IMAGE:-ghcr.io/balkhaev/trader-server:sha-e58691fc7500769321ea8c1175d0a6f358317f3a}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://trader:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/trader
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://trader.balkhaev.com}
      CORS_ORIGIN: ${PUBLIC_URL:-https://trader.balkhaev.com}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      ENCRYPTION_KEY: ${SERVICE_HEX_64_ENCRYPTION}
      STRATEGY_SCHEDULER_ENABLED: ${STRATEGY_SCHEDULER_ENABLED:-true}
      ALLOW_LIVE_TRADING: "false"
    command:
      - sh
      - -lc
      - bun --cwd packages/db run db:push && exec bun --cwd apps/server run start
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch('http://localhost:3000/health'); if(!r.ok) process.exit(1)
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:-ghcr.io/balkhaev/trader-web:sha-e58691fc7500769321ea8c1175d0a6f358317f3a}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch('http://localhost:3001'); if(!r.ok) process.exit(1)
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
