name: Altcoin pooled ML round 61

on:
  pull_request:
    paths:
      - 'research/altcoin-pooled-ml-round61/**'
      - '.github/workflows/altcoin-pooled-ml-round61.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      PANDAS_COPY_ON_WRITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.6,<2' 'joblib>=1.4,<2' 'tabulate>=0.9,<1'
      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round34
          key: altcoin-round34-usdm-trend-15m-2024-2026-v1
      - name: Run research
        run: |
          python -m py_compile research/altcoin-round34-trend/run.py research/altcoin-pooled-ml-round61/run.py
          rm -rf artifacts/altcoin-pooled-ml-round61
          mkdir -p artifacts/altcoin-pooled-ml-round61
          python research/altcoin-pooled-ml-round61/run.py --output artifacts/altcoin-pooled-ml-round61 --cache .cache/binance-altcoin-round34 --workers 32
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-pooled-ml-round61-results
          path: artifacts/altcoin-pooled-ml-round61
          if-no-files-found: warn
          retention-days: 7
