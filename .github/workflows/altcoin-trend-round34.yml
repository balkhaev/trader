name: Altcoin trend breakout round 34

on:
  pull_request:
    paths:
      - "research/altcoin-round34-trend/**"
      - ".github/workflows/altcoin-trend-round34.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round34
          key: altcoin-round34-usdm-trend-15m-2024-2026-v1

      - name: Compile runner
        run: python -m py_compile research/altcoin-round34-trend/run.py

      - name: Run broad trend research
        run: |
          rm -rf artifacts/altcoin-round34-trend
          mkdir -p artifacts/altcoin-round34-trend
          python research/altcoin-round34-trend/run.py \
            --output artifacts/altcoin-round34-trend \
            --cache .cache/binance-altcoin-round34 \
            --workers 32
          cp research/altcoin-round34-trend/run.py artifacts/altcoin-round34-trend/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round34-trend-results
          path: artifacts/altcoin-round34-trend
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
