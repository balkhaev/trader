name: Altcoin premium round 27

on:
  pull_request:
    paths:
      - "research/altcoin-round27-premium/**"
      - ".github/workflows/altcoin-premium-round27.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round27
          key: altcoin-round27-usdm-premium-2025h2-2026july-v1
      - name: Compile modules
        run: python -m py_compile research/altcoin-round27-premium/*.py
      - name: Run official premium research
        run: |
          rm -rf artifacts/altcoin-round27-premium
          mkdir -p artifacts/altcoin-round27-premium
          PYTHONPATH=research/altcoin-round27-premium \
            python research/altcoin-round27-premium/run.py \
              --output artifacts/altcoin-round27-premium \
              --cache .cache/binance-altcoin-round27 \
              --workers 24
          cp research/altcoin-round27-premium/*.py artifacts/altcoin-round27-premium/
          cp research/altcoin-round27-premium/README.md artifacts/altcoin-round27-premium/README.md
      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round27-premium-results
          path: artifacts/altcoin-round27-premium
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
