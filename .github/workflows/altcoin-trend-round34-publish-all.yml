name: Altcoin trend breakout round 34 publish all

on:
  pull_request:
    paths:
      - ".github/workflows/altcoin-trend-round34-publish-all.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/altcoin-trend-round34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-trend-round34
          key: altcoin-trend-round34-usdm-15m-2024-2026-v1
      - run: |
          rm -rf /tmp/altcoin-trend-round34-all
          mkdir -p /tmp/altcoin-trend-round34-all
          python research/altcoin-round34-trend/run.py --output /tmp/altcoin-trend-round34-all --cache .cache/binance-altcoin-trend-round34 --workers 32
      - name: Commit all text research outputs
        run: |
          rm -rf research/altcoin-round34-trend/results_all
          mkdir -p research/altcoin-round34-trend/results_all
          find /tmp/altcoin-trend-round34-all -maxdepth 1 -type f \( -name '*.csv' -o -name '*.json' -o -name '*.md' -o -name '*.txt' \) -exec cp {} research/altcoin-round34-trend/results_all/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/altcoin-round34-trend/results_all
          git diff --cached --quiet || git commit -m "Publish all trend outputs [skip ci]"
          git push origin HEAD:agent/altcoin-trend-round34
      - uses: actions/upload-artifact@v4
        with:
          name: altcoin-round34-trend-all-results
          path: /tmp/altcoin-trend-round34-all
          retention-days: 7
