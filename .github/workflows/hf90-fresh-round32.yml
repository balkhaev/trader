name: HF90 official fresh replay round 32

on:
  pull_request:
    paths:
      - "research/hf90-round32/**"
      - ".github/workflows/hf90-fresh-round32.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hf90-fresh-round32
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "scikit-learn>=1.6,<2" "tabulate>=0.9,<1"

      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-hf90-round32
          key: hf90-round32-usdm-btceth-5m-2024-2026-v1

      - name: Compile and run fixed replay
        run: |
          python -m py_compile research/hf90-round32/run.py
          rm -rf /tmp/hf90-round32
          mkdir -p /tmp/hf90-round32
          python research/hf90-round32/run.py \
            --output /tmp/hf90-round32 \
            --cache .cache/binance-hf90-round32 \
            --workers 8

      - name: Publish compact factual results
        run: |
          rm -rf research/hf90-round32/results
          mkdir -p research/hf90-round32/results
          for name in SUMMARY.json REPORT_RU.md PERIOD_METRICS.csv ACCOUNT_SCENARIOS.csv MODEL_SPEC.json FEATURES.csv; do
            if [ -f "/tmp/hf90-round32/$name" ]; then
              cp "/tmp/hf90-round32/$name" "research/hf90-round32/results/$name"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hf90-round32/results
          git diff --cached --quiet || git commit -m "Publish HF90 fresh replay results [skip ci]"
          git push origin HEAD:agent/hf90-fresh-round32

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf90-round32-results
          path: /tmp/hf90-round32
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
