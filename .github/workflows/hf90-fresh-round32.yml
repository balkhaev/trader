name: HF90 official fresh replay round 32

on:
  pull_request:
    paths:
      - "research/hf90-round32/**"
      - ".github/workflows/hf90-fresh-round32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "scikit-learn>=1.4,<2" "lightgbm>=4.3,<5" "joblib>=1.3,<2" "tabulate>=0.9,<1"
      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-hf90-round32
          key: hf90-round32-usdm-btceth-5m-2024-2026-v2
      - name: Compile and run fixed replay
        run: |
          python -m py_compile research/hf90-round32/run.py
          rm -rf artifacts/hf90-round32
          mkdir -p artifacts/hf90-round32
          python research/hf90-round32/run.py \
            --output artifacts/hf90-round32 \
            --cache .cache/binance-hf90-round32 \
            --workers 8
          find artifacts/hf90-round32 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/hf90-round32/SHA256SUMS.txt
      - name: Upload full research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf90-round32-official-fresh-results
          path: artifacts/hf90-round32
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
