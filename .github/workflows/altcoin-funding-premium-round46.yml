name: Altcoin funding premium round 46

on:
  pull_request:
    paths:
      - "research/altcoin-round46-funding-premium/**"
      - ".github/workflows/altcoin-funding-premium-round46.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-funding-premium-round46
          key: funding-premium-round46-usdm-2024-2026h1-v1
      - name: Patch enriched price frame
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/altcoin-round46-funding-premium/run.py')
          text = path.read_text()
          old = '''        if len(p) and len(q) and len(f):
            prices[symbol] = p
            premium[symbol] = q
            funding[symbol] = f
            event_parts.append(build_symbol_events(p, q, f, symbol))
'''
          new = '''        if len(p) and len(q) and len(f):
            p = p.copy()
            for column in ("open", "high", "low", "close", "volume", "quote_volume"):
                p[column] = pd.to_numeric(p[column], errors="coerce")
            p["atr"] = atr(p)
            prices[symbol] = p
            premium[symbol] = q
            funding[symbol] = f
            event_parts.append(build_symbol_events(p, q, f, symbol))
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Compile and run funding premium confluence research
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round46-funding-premium/run.py
          rm -rf artifacts/altcoin-round46-funding-premium
          mkdir -p artifacts/altcoin-round46-funding-premium
          PYTHONPATH=research/altcoin-round27-premium python research/altcoin-round46-funding-premium/run.py \
            --output artifacts/altcoin-round46-funding-premium \
            --cache .cache/binance-funding-premium-round46 \
            --workers 32
          cp research/altcoin-round46-funding-premium/run.py artifacts/altcoin-round46-funding-premium/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round46-funding-premium-results
          path: artifacts/altcoin-round46-funding-premium
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
