name: Altcoin July forward round 16

on:
  pull_request:
    paths:
      - "research/altcoin-round16-july/**"
      - ".github/workflows/altcoin-forward-round16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round16
          key: altcoin-round16-july-usdm-15m-v1

      - name: Compile runner
        run: python -m py_compile research/altcoin-round16-july/run_round16.py

      - name: Run fresh July check
        run: |
          rm -rf artifacts/altcoin-round16-july
          mkdir -p artifacts/altcoin-round16-july
          python research/altcoin-round16-july/run_round16.py \
            --output artifacts/altcoin-round16-july \
            --cache .cache/binance-altcoin-round16
          cp research/altcoin-round16-july/run_round16.py artifacts/altcoin-round16-july/

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round16-july-results
          path: artifacts/altcoin-round16-july
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
