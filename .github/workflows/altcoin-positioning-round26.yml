name: Altcoin positioning round 26

on:
  pull_request:
    paths:
      - "research/altcoin-round26-positioning/**"
      - ".github/workflows/altcoin-positioning-round26.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round26
          key: altcoin-round26-usdm-positioning-2025h2-2026july-v1

      - name: Compile research modules
        run: python -m py_compile research/altcoin-round26-positioning/*.py

      - name: Run official positioning research
        run: |
          rm -rf artifacts/altcoin-round26-positioning
          mkdir -p artifacts/altcoin-round26-positioning
          PYTHONPATH=research/altcoin-round26-positioning \
            python research/altcoin-round26-positioning/run.py \
              --output artifacts/altcoin-round26-positioning \
              --cache .cache/binance-altcoin-round26 \
              --workers 32
          cp research/altcoin-round26-positioning/*.py artifacts/altcoin-round26-positioning/
          cp research/altcoin-round26-positioning/README.md artifacts/altcoin-round26-positioning/README.md

      - name: Upload complete research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round26-positioning-results
          path: artifacts/altcoin-round26-positioning
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
