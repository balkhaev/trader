name: HF90 official fresh replay publish all

on:
  pull_request:
    paths:
      - ".github/workflows/hf90-fresh-round32-publish-all.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hf90-fresh-round32
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "scikit-learn>=1.6,<2" "tabulate>=0.9,<1"
      - uses: actions/cache@v4
        with:
          path: .cache/binance-hf90-round32
          key: hf90-round32-usdm-btceth-5m-2024-2026-v1
      - run: |
          rm -rf /tmp/hf90-round32-all
          mkdir -p /tmp/hf90-round32-all
          python research/hf90-round32/run.py --output /tmp/hf90-round32-all --cache .cache/binance-hf90-round32 --workers 8
      - name: Commit all text research outputs
        run: |
          rm -rf research/hf90-round32/results_all
          mkdir -p research/hf90-round32/results_all
          find /tmp/hf90-round32-all -maxdepth 1 -type f \( -name '*.csv' -o -name '*.json' -o -name '*.md' -o -name '*.txt' \) -exec cp {} research/hf90-round32/results_all/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/hf90-round32/results_all
          git diff --cached --quiet || git commit -m "Publish all HF90 outputs [skip ci]"
          git push origin HEAD:agent/hf90-fresh-round32
      - uses: actions/upload-artifact@v4
        with:
          name: hf90-round32-all-results
          path: /tmp/hf90-round32-all
          retention-days: 7
