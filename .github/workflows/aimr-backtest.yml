name: AIMR intraday backtest

on:
  pull_request:
    branches: [main]
    paths:
      - "research/aimr_intraday/**"
      - ".github/workflows/aimr-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimr-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/aimr_intraday/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/aimr_intraday/requirements.txt

      - name: Validate execution model and payload
        run: python research/aimr_intraday/bootstrap.py --self-test

      - name: Run BTC/ETH 5-minute backtest
        run: |
          python research/aimr_intraday/bootstrap.py \
            --output research/aimr_intraday/artifacts \
            --cache .cache/binance_vision

      - name: Upload reproducible research packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aimr-intraday-backtest
          path: research/aimr_intraday/artifacts
          if-no-files-found: error
          retention-days: 30
