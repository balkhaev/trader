name: Funding coin-specific round 57

on:
  pull_request:
    paths:
      - 'research/funding-coin-specific-round57/**'
      - '.github/workflows/funding-coin-specific-round57.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'tabulate>=0.9,<1'
      - name: Restore verified funding archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round27
          key: altcoin-round27-usdm-premium-funding-2024-2026-v2
      - name: Run research
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round41-funding-carry/run.py research/funding-coin-specific-round57/run.py
          rm -rf artifacts/funding-coin-specific-round57
          mkdir -p artifacts/funding-coin-specific-round57
          PYTHONPATH=research/altcoin-round27-premium python research/funding-coin-specific-round57/run.py --output artifacts/funding-coin-specific-round57 --cache .cache/binance-altcoin-round27 --workers 24
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-coin-specific-round57-results
          path: artifacts/funding-coin-specific-round57
          if-no-files-found: warn
          retention-days: 7
