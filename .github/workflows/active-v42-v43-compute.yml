name: Active V42-V43 OI crowding compute

on:
  push:
    branches: [agent/active-v42-v43-oi-crowding]
    paths:
      - "research/active_v42_compute/**"
      - ".github/workflows/active-v42-v43-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v42_compute/**"
      - ".github/workflows/active-v42-v43-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore BTC market and metrics cache
        uses: actions/cache@v4
        with:
          path: .cache/v42
          key: binance-btc-oi-crowding-2020-09-2026-06-v1
      - name: Reconstruct and verify source
        run: python research/active_v42_compute/bootstrap.py --extract-only
      - name: Install dependencies
        run: python -m pip install -r research/active_v42_compute/generated/requirements.txt
      - name: Compile source
        run: python -m py_compile research/active_v42_compute/generated/*.py
      - name: Run deterministic causal self-test
        run: python research/active_v42_compute/bootstrap.py --self-test
      - name: Run full Active V42-V43 research
        id: research
        continue-on-error: true
        run: |
          mkdir -p artifacts/active_v42_v43
          set -o pipefail
          python research/active_v42_compute/bootstrap.py --cache .cache/v42 --output artifacts/active_v42_v43 2>&1 | tee artifacts/active_v42_v43/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/active_v42_v43/run_exit_code.txt
          exit "$code"
      - name: Preserve source and manifest
        if: always()
        run: |
          mkdir -p artifacts/active_v42_v43/source
          cp research/active_v42_compute/generated/* artifacts/active_v42_v43/source/ || true
          cp research/active_v42_compute/manifest.json artifacts/active_v42_v43/source_payload_manifest.json
          echo "${{ steps.research.outcome }}" > artifacts/active_v42_v43/workflow_research_outcome.txt
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v42-v43-oi-crowding
          path: artifacts/active_v42_v43
          if-no-files-found: warn
          retention-days: 30
