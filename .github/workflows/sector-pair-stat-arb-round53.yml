name: Sector pair stat-arb round 53

on:
  pull_request:
    paths:
      - "research/sector-pair-stat-arb-round53/**"
      - ".github/workflows/sector-pair-stat-arb-round53.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-sector-pair-round53
          key: sector-pair-round53-usdm-2024-2026h1-v1
      - name: Compile and run sector-pair stat-arb research
        run: |
          python -m py_compile research/sector-pair-stat-arb-round53/run.py
          rm -rf artifacts/sector-pair-stat-arb-round53
          mkdir -p artifacts/sector-pair-stat-arb-round53
          python research/sector-pair-stat-arb-round53/run.py \
            --output artifacts/sector-pair-stat-arb-round53 \
            --cache .cache/binance-sector-pair-round53 \
            --workers 32
          cp research/sector-pair-stat-arb-round53/run.py artifacts/sector-pair-stat-arb-round53/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-pair-stat-arb-round53-results
          path: artifacts/sector-pair-stat-arb-round53
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
