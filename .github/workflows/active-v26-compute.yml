name: Active V26 quarterly basis compute

on:
  push:
    branches:
      - agent/active-v26-basis-compute
    paths:
      - "research/active_v26_compute/**"
      - ".github/workflows/active-v26-compute.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/active_v26_compute/**"
      - ".github/workflows/active-v26-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/v26
          key: binance-v26-quarterly-basis-2020-2026

      - name: Reconstruct and verify source
        run: python research/active_v26_compute/bootstrap.py --extract-only

      - name: Install dependencies
        run: python -m pip install -r research/active_v26_compute/generated/requirements.txt

      - name: Compile source
        run: python -m py_compile research/active_v26_compute/generated/run.py

      - name: Run deterministic self-test
        run: python research/active_v26_compute/bootstrap.py --self-test

      - name: Run full Active V26 research
        run: |
          python research/active_v26_compute/bootstrap.py \
            --output artifacts/active_v26 \
            --cache .cache/v26
          mkdir -p artifacts/active_v26/source
          cp research/active_v26_compute/generated/* artifacts/active_v26/source/
          cp research/active_v26_compute/manifest.json artifacts/active_v26/source_payload_manifest.json

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v26-quarterly-basis
          path: artifacts/active_v26
          if-no-files-found: warn
          retention-days: 30
