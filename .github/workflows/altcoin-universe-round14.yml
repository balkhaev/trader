name: Altcoin universe research round 14

on:
  pull_request:
    paths:
      - "research/altcoin-round14/**"
      - ".github/workflows/altcoin-universe-round14.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "pyarrow>=17,<22" "matplotlib>=3.9,<4" "tabulate>=0.9,<1"

      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round14
          key: altcoin-round14-binance-usdm-5m-2024-2026-v1

      - name: Decode and verify research runner
        run: |
          cat research/altcoin-round14/payload/chunk_*.b64 | base64 --decode | gzip -dc > /tmp/run_altcoin_research.py
          echo "5e37043ba740dcf0cfb3b739e028b93b5ce1400ea46ac71f9fff80f29da9b0a7  /tmp/run_altcoin_research.py" | sha256sum -c -
          # Avoid retaining both raw and feature DataFrames for the full universe.
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/run_altcoin_research.py')
          s = p.read_text()
          s = s.replace('    raw_map: dict[str, pd.DataFrame] = {}\n', '')
          s = s.replace('        raw_map[symbol] = raw\n', '')
          p.write_text(s)
          PY
          python -m py_compile /tmp/run_altcoin_research.py

      - name: Run official USD-M multi-coin research
        run: |
          rm -rf artifacts/altcoin-round14
          mkdir -p artifacts/altcoin-round14
          python /tmp/run_altcoin_research.py \
            --output artifacts/altcoin-round14 \
            --cache .cache/binance-altcoin-round14 \
            --workers 12
          cp /tmp/run_altcoin_research.py artifacts/altcoin-round14/run_altcoin_research.py

      - name: Upload complete research package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-universe-round14-results
          path: artifacts/altcoin-round14
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
