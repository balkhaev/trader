name: Altcoin universe research round 14

on:
  pull_request:
    paths:
      - "research/altcoin-round14/**"
      - ".github/workflows/altcoin-universe-round14.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round14
          key: altcoin-round14-binance-usdm-5m-funding-2024-2026-v2

      - name: Compile readable research modules
        run: |
          python -m py_compile research/altcoin-round14/src/*.py

      - name: Run official USD-M multi-coin research
        shell: bash
        run: |
          set -o pipefail
          rm -rf artifacts/altcoin-round14
          mkdir -p artifacts/altcoin-round14/source
          python research/altcoin-round14/src/run.py \
            --output artifacts/altcoin-round14 \
            --cache .cache/binance-altcoin-round14 \
            --workers 12 2>&1 | tee artifacts/altcoin-round14/run.log
          cp research/altcoin-round14/src/*.py artifacts/altcoin-round14/source/
          cp research/altcoin-round14/README.md artifacts/altcoin-round14/

      - name: Upload complete research package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-universe-round14-results
          path: artifacts/altcoin-round14
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
