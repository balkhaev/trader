name: Active V49-V50 onchain budget compute

on:
  push:
    branches: [agent/active-v49-v50-onchain-budget]
    paths:
      - "research/active_v49_compute/**"
      - ".github/workflows/active-v49-v50-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v49_compute/**"
      - ".github/workflows/active-v49-v50-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned V44 market and onchain cache
        uses: actions/cache@v4
        with:
          path: .cache/v44
          key: v44-coinmetrics-f1a36a-binance-btc-2015-2026-v1
      - name: Reconstruct and verify frozen V44 source
        run: python research/active_v44_compute/bootstrap.py --extract-only
      - name: Install dependencies
        run: python -m pip install -r research/active_v44_compute/generated/requirements.txt
      - name: Reconstruct and verify V49 source
        run: |
          cat research/active_v49_compute/part_*.pyfrag > research/active_v49_compute/run_v49.py
          echo "3e0e1693133b153fd4b7903b0f3cf2bc14a48f45b86cf7583647c2101300c8e3  research/active_v49_compute/run_v49.py" | sha256sum -c -
          echo "c805f03f8ad10c52a8a6ec781ed8557eca1510e27af43aef6ec46fb366130f04  research/active_v46_compute/run_v46.py" | sha256sum -c -
          python -m py_compile research/active_v49_compute/run_v49.py research/active_v46_compute/run_v46.py
      - name: Run causal risk-budget self-test
        run: python research/active_v49_compute/run_v49.py --self-test
      - name: Run full Active V49-V50 research
        id: research
        continue-on-error: true
        run: |
          mkdir -p artifacts/active_v49_v50
          set -o pipefail
          python research/active_v49_compute/run_v49.py \
            --source research/active_v44_compute/generated \
            --v46-source research/active_v46_compute/run_v46.py \
            --cache .cache/v44 \
            --output artifacts/active_v49_v50 \
            2>&1 | tee artifacts/active_v49_v50/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/active_v49_v50/run_exit_code.txt
          exit "$code"
      - name: Preserve exact source and provenance
        if: always()
        run: |
          mkdir -p artifacts/active_v49_v50/source
          cp research/active_v49_compute/run_v49.py artifacts/active_v49_v50/source/ || true
          cp research/active_v46_compute/run_v46.py artifacts/active_v49_v50/source/ || true
          cp -r research/active_v44_compute/generated artifacts/active_v49_v50/source/v44 || true
          echo "${{ steps.research.outcome }}" > artifacts/active_v49_v50/workflow_research_outcome.txt
          echo "${{ github.sha }}" > artifacts/active_v49_v50/compute_commit.txt
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v49-v50-onchain-budget
          path: artifacts/active_v49_v50
          if-no-files-found: warn
          retention-days: 30
