name: Active V67-V68 blended onchain spot-perpetual compute

on:
  push:
    branches: [agent/active-v67-v68-compute]
    paths:
      - "research/active_v67_v68_compute/**"
      - ".github/workflows/active-v67-v68-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v67_v68_compute/**"
      - ".github/workflows/active-v67-v68-compute.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      V5_ARTIFACT: "8575347195"
      V5_SHA256: "43ac64a77e205e9fed4601ebdb526bd71495beb8a0e76751bad91685ebad0a63"
      V50_ARTIFACT: "8607140186"
      V50_SHA256: "525b22c6dfa31fb3a16fdd406b5ed9d6724b83dea03847dc4b7e52c00e702c9e"
      V52_ARTIFACT: "8608583166"
      V52_SHA256: "b6c74d40f145ea1d5ebbe427626bf3211985e16cd80d1c4f5d7457d2753d593b"
      V62_ARTIFACT: "8611054896"
      V62_SHA256: "9b6a1b86b7a458a13b4a910998a3efaedf0c17a8f80965f165490516fc483573"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify V67-V68 source
        run: |
          set -euxo pipefail
          manifest=research/active_v67_v68_compute/manifest.json
          for i in 000 001; do
            test "$(wc -c < research/active_v67_v68_compute/v67_part_${i}.pyfrag)" -gt 0
          done
          cat research/active_v67_v68_compute/v67_part_*.pyfrag > research/active_v67_v68_compute/v67_blended_onchain_market.py
          echo "996c83a5df824b2c23f17871d105148a69a3e52d7ec3f4040e1a4e1329bf1a1a  research/active_v67_v68_compute/v67_blended_onchain_market.py" | sha256sum -c -
          echo "c8e657688ee00b513ab769e9348c5898c1e1e55b62d12662ba5eae505306b15d  research/active_v67_v68_compute/v68_v67_intrabar.py" | sha256sum -c -
          python -m py_compile research/active_v67_v68_compute/v67_blended_onchain_market.py research/active_v67_v68_compute/v68_v67_intrabar.py
      - name: Download and verify exact frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v67inputs/{v5,v50,v52,v62}
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          for item in "v5:$V5_ARTIFACT:$V5_SHA256" "v50:$V50_ARTIFACT:$V50_SHA256" "v52:$V52_ARTIFACT:$V52_SHA256" "v62:$V62_ARTIFACT:$V62_SHA256"; do
            IFS=: read -r name aid digest <<< "$item"
            curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/$aid/zip" -o "/tmp/$name.zip"
            echo "$digest  /tmp/$name.zip" | sha256sum -c -
            unzip -q "/tmp/$name.zip" -d "/tmp/v67inputs/$name"
          done
      - name: Stage exact market data and source dependencies
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/data/v6_proc /mnt/data/v5_proc/processed /mnt/data/v49_reopen /mnt/data/v52_result
          sudo chown -R "$USER":"$USER" /mnt/data
          cp /tmp/v67inputs/v5/processed/spot_BTCUSDT_1d.csv /mnt/data/v6_proc/processed_BTCUSDT_1d.csv
          cp /tmp/v67inputs/v5/processed/spot_ETHUSDT_1d.csv /mnt/data/v6_proc/processed_ETHUSDT_1d.csv
          cp /tmp/v67inputs/v5/processed/perp_BTCUSDT_8h.csv /mnt/data/v5_proc/processed/
          cp /tmp/v67inputs/v5/processed/perp_ETHUSDT_8h.csv /mnt/data/v5_proc/processed/
          cp /tmp/v67inputs/v5/processed/funding_BTCUSDT.csv /mnt/data/v5_proc/processed/
          cp /tmp/v67inputs/v5/processed/funding_ETHUSDT.csv /mnt/data/v5_proc/processed/
          cp /tmp/v67inputs/v50/v50_multiplicative_stress_full_equity.csv /mnt/data/v49_reopen/
          cp /tmp/v67inputs/v52/stress_full_equity.csv /mnt/data/v52_result/
          cp /tmp/v67inputs/v62/source/*.py /mnt/data/
          cp /tmp/v67inputs/v62/source/requirements.txt /mnt/data/requirements.txt
          cp research/active_v67_v68_compute/v67_blended_onchain_market.py /mnt/data/
          cp research/active_v67_v68_compute/v68_v67_intrabar.py /mnt/data/
          echo "1243a5325baa8bfd68ac2c73c614f3a2c413e2c5548800e659b0293de4f26474  /mnt/data/v62_onchain_spot_perp.py" | sha256sum -c -
          echo "46e90cbd6eb7455ada6b50a64c2877e553c6cd5bbd5c6d72893aa62611dabf72  /mnt/data/v64_v52_spot_perp.py" | sha256sum -c -
          echo "dc390c97294f8617e6cf7fa95da0ba34bbd106450b1b6add74f2e737c5a9c43a  /mnt/data/v66_v65_intrabar_margin_audit.py" | sha256sum -c -
      - name: Install dependencies
        run: python -m pip install -r /mnt/data/requirements.txt
      - name: Run causal source self-test
        run: python /mnt/data/v67_blended_onchain_market.py --self-test
      - name: Run full V67-V68 research and audit
        run: |
          set -euxo pipefail
          python /mnt/data/v67_blended_onchain_market.py | tee /mnt/data/v67.log
          python /mnt/data/v68_v67_intrabar.py | tee /mnt/data/v68.log
      - name: Preserve complete evidence
        if: always()
        run: |
          mkdir -p artifacts/active_v67_v68/source artifacts/active_v67_v68/results
          cp /mnt/data/v67_blended_onchain_market.py /mnt/data/v68_v67_intrabar.py artifacts/active_v67_v68/source/ || true
          cp research/active_v67_v68_compute/manifest.json artifacts/active_v67_v68/source_manifest.json
          cp -r /mnt/data/v67_blended_onchain_market /mnt/data/v68_v67_intrabar artifacts/active_v67_v68/results/ || true
          cp /mnt/data/v67.log /mnt/data/v68.log artifacts/active_v67_v68/ || true
          printf '%s\n' "$V5_ARTIFACT $V5_SHA256" "$V50_ARTIFACT $V50_SHA256" "$V52_ARTIFACT $V52_SHA256" "$V62_ARTIFACT $V62_SHA256" > artifacts/active_v67_v68/input_artifacts.txt
          echo "${{ github.sha }}" > artifacts/active_v67_v68/compute_commit.txt
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v67-v68-blended-onchain-spot-perp
          path: artifacts/active_v67_v68
          if-no-files-found: error
          retention-days: 30
