name: Active V51 exact V50 robustness audit

on:
  push:
    branches: [agent/active-v51-v50-audit-clean]
    paths:
      - "research/active_v51_compute/**"
      - ".github/workflows/active-v51-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v51_compute/**"
      - ".github/workflows/active-v51-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      V44_COMMIT: c96d10fe46ef5668514f1279db17941dade931c4
      V49_COMMIT: 123c8a8715d3631700f43d071576d3078686bb74
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned market and onchain cache
        uses: actions/cache@v4
        with:
          path: .cache/v44
          key: v44-coinmetrics-f1a36a-binance-btc-2015-2026-v1
      - name: Fetch and verify exact frozen dependencies
        run: |
          set -euxo pipefail
          raw=https://raw.githubusercontent.com/balkhaev/trader
          mkdir -p research/active_v44_compute/payload research/active_v46_compute research/active_v49_compute
          curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/bootstrap.py" -o research/active_v44_compute/bootstrap.py
          curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/manifest.json" -o research/active_v44_compute/manifest.json
          for i in $(seq 0 12); do
            n=$(printf '%03d' "$i")
            curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/payload/chunk_$n" -o "research/active_v44_compute/payload/chunk_$n"
          done
          curl -fL "$raw/$V44_COMMIT/research/active_v46_compute/run_v46.py" -o research/active_v46_compute/run_v46.py
          for n in 000 001 002; do
            curl -fL "$raw/$V49_COMMIT/research/active_v49_compute/part_$n.pyfrag" -o "research/active_v49_compute/part_$n.pyfrag"
          done
          python research/active_v44_compute/bootstrap.py --extract-only
          cat research/active_v49_compute/part_*.pyfrag > research/active_v49_compute/run_v49.py
          echo "c805f03f8ad10c52a8a6ec781ed8557eca1510e27af43aef6ec46fb366130f04  research/active_v46_compute/run_v46.py" | sha256sum -c -
          echo "3e0e1693133b153fd4b7903b0f3cf2bc14a48f45b86cf7583647c2101300c8e3  research/active_v49_compute/run_v49.py" | sha256sum -c -
      - name: Reconstruct and verify V51 source
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('research/active_v51_compute')
          parts = sorted(root.glob('part_*.pyfrag'))
          if not parts:
              raise SystemExit('no V51 fragments')
          out = bytearray()
          for i, path in enumerate(parts):
              data = path.read_bytes()
              if i < len(parts) - 1 and data.endswith(b'\n'):
                  data = data[:-1]
              out.extend(data)
          (root / 'run_v51.py').write_bytes(out)
          PY
          echo "fbf5ac8c1a7ed69f26ce3a9272f2a7799f551a9795f286a82ed9f73c878da369  research/active_v51_compute/run_v51.py" | sha256sum -c -
      - name: Install dependencies
        run: python -m pip install -r research/active_v44_compute/generated/requirements.txt
      - name: Compile exact sources
        run: python -m py_compile research/active_v44_compute/generated/*.py research/active_v46_compute/run_v46.py research/active_v49_compute/run_v49.py research/active_v51_compute/run_v51.py
      - name: Run immutable audit self-test
        run: python research/active_v51_compute/run_v51.py --self-test
      - name: Run full Active V51 audit
        id: audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/active_v51
          set -o pipefail
          python research/active_v51_compute/run_v51.py \
            --v44-source research/active_v44_compute/generated \
            --v46-source research/active_v46_compute/run_v46.py \
            --v49-source research/active_v49_compute/run_v49.py \
            --cache .cache/v44 \
            --output artifacts/active_v51 \
            2>&1 | tee artifacts/active_v51/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/active_v51/run_exit_code.txt
          exit "$code"
      - name: Preserve exact source and provenance
        if: always()
        run: |
          mkdir -p artifacts/active_v51/source
          cp research/active_v51_compute/run_v51.py artifacts/active_v51/source/ || true
          cp research/active_v49_compute/run_v49.py artifacts/active_v51/source/ || true
          cp research/active_v46_compute/run_v46.py artifacts/active_v51/source/ || true
          cp -r research/active_v44_compute/generated artifacts/active_v51/source/v44 || true
          echo "${{ steps.audit.outcome }}" > artifacts/active_v51/workflow_audit_outcome.txt
          echo "${{ github.sha }}" > artifacts/active_v51/compute_commit.txt
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v51-exact-v50-audit
          path: artifacts/active_v51
          if-no-files-found: warn
          retention-days: 30