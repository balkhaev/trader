name: Coin-specific funding premium round 64

on:
  pull_request:
    paths:
      - "research/altcoin-round64-coin-funding-premium/**"
      - ".github/workflows/altcoin-coin-funding-premium-round64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round27
          key: altcoin-round27-usdm-premium-funding-2024-2026-v2
          restore-keys: |
            altcoin-round27-usdm-premium-funding-
      - name: Compile and run coin-specific research
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round46-funding-premium/*.py research/altcoin-round64-coin-funding-premium/run.py
          rm -rf artifacts/altcoin-round64-coin-funding-premium
          mkdir -p artifacts/altcoin-round64-coin-funding-premium
          python research/altcoin-round64-coin-funding-premium/run.py \
            --output artifacts/altcoin-round64-coin-funding-premium \
            --cache .cache/binance-altcoin-round27 \
            --workers 24
          cp research/altcoin-round64-coin-funding-premium/run.py artifacts/altcoin-round64-coin-funding-premium/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round64-coin-funding-premium-results
          path: artifacts/altcoin-round64-coin-funding-premium
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
