name: WIF exit optimization round 58

on:
  pull_request:
    paths:
      - 'research/wif-exit-round58/**'
      - '.github/workflows/wif-exit-round58.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'tabulate>=0.9,<1'
      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round55
          key: altcoin-round55-usdm-30coins-2024-2026-v1
      - name: Run research
        run: |
          python -m py_compile research/altcoin-round28-confluence/*.py research/wif-exit-round58/run.py
          rm -rf artifacts/wif-exit-round58
          mkdir -p artifacts/wif-exit-round58
          python research/wif-exit-round58/run.py --output artifacts/wif-exit-round58 --cache .cache/binance-altcoin-round55 --workers 24
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wif-exit-round58-results
          path: artifacts/wif-exit-round58
          if-no-files-found: warn
          retention-days: 7
