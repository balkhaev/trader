name: Altcoin trend breakout round 34 publish

on:
  pull_request:
    paths:
      - ".github/workflows/altcoin-trend-round34-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/altcoin-trend-round34
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-trend-round34
          key: altcoin-trend-round34-usdm-15m-2024-2026-v1

      - name: Run trend research
        run: |
          rm -rf /tmp/altcoin-trend-round34
          mkdir -p /tmp/altcoin-trend-round34
          python research/altcoin-round34-trend/run.py \
            --output /tmp/altcoin-trend-round34 \
            --cache .cache/binance-altcoin-trend-round34 \
            --workers 32

      - name: Publish compact factual results to branch
        run: |
          rm -rf research/altcoin-round34-trend/results
          mkdir -p research/altcoin-round34-trend/results
          for name in SUMMARY.json REPORT_RU.md SELECTION_BEFORE_FIXED_PERIODS.csv FIXED_PERIOD_METRICS.csv ACCOUNT_SCENARIOS.csv; do
            if [ -f "/tmp/altcoin-trend-round34/$name" ]; then
              cp "/tmp/altcoin-trend-round34/$name" "research/altcoin-round34-trend/results/$name"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/altcoin-round34-trend/results
          git diff --cached --quiet || git commit -m "Publish trend research results [skip ci]"
          git push origin HEAD:agent/altcoin-trend-round34

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round34-trend-published-results
          path: /tmp/altcoin-trend-round34
          if-no-files-found: error
          retention-days: 7
