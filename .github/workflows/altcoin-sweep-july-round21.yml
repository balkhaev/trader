name: Altcoin fixed sweep July round 21

on:
  pull_request:
    paths:
      - "research/altcoin-round21-sweep-july/**"
      - ".github/workflows/altcoin-sweep-july-round21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round14
          key: altcoin-round14-binance-usdm-5m-funding-2024-2026-v2

      - name: Compile runner
        run: |
          python -m py_compile research/altcoin-round14/src/*.py research/altcoin-round21-sweep-july/run.py

      - name: Run fixed sweep July check
        run: |
          rm -rf artifacts/altcoin-round21-sweep-july
          mkdir -p artifacts/altcoin-round21-sweep-july
          PYTHONPATH=research/altcoin-round14/src python research/altcoin-round21-sweep-july/run.py \
            --output artifacts/altcoin-round21-sweep-july \
            --cache .cache/binance-altcoin-round14
          cp research/altcoin-round21-sweep-july/run.py artifacts/altcoin-round21-sweep-july/run.py
          cp research/altcoin-round21-sweep-july/README.md artifacts/altcoin-round21-sweep-july/README.md

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round21-sweep-july-results
          path: artifacts/altcoin-round21-sweep-july
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
