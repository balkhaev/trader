name: Active V36 basis convergence compute

on:
  push:
    branches: [agent/active-v33-multiasset-carry]
    paths:
      - "research/active_v36_compute/**"
      - ".github/workflows/active-v36-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v36_compute/**"
      - ".github/workflows/active-v36-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore V33 Binance cache
        uses: actions/cache@v4
        with:
          path: .cache/v33
          key: binance-v33-fixed-universe-8h-2020-2026
      - name: Reconstruct shared source
        run: python research/active_v33_compute/bootstrap.py --extract-only
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 numba==0.65.1
      - name: Verify and compile V36
        run: |
          echo "4f86ccc1f797b78cdc91a0723458f16dfab45179843b79523188676b09e81c04  research/active_v36_compute/run_v36.py" | sha256sum -c -
          python -m py_compile research/active_v36_compute/run_v36.py
      - name: Run Active V36 research
        run: python research/active_v36_compute/run_v36.py --cache .cache/v33 --output artifacts/active_v36
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v36-basis-convergence
          path: artifacts/active_v36
          if-no-files-found: warn
          retention-days: 30
