name: Funding full history round 50

on:
  pull_request:
    paths:
      - "research/altcoin-round50-funding-full/**"
      - ".github/workflows/funding-full-history-round50.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified funding cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-funding-full-round50
          key: funding-full-round50-usdm-2024-2026h1-v1
      - name: Compile and run full four-block funding grid
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round41-funding-carry/run.py research/altcoin-round50-funding-full/run.py
          rm -rf artifacts/funding-full-round50
          mkdir -p artifacts/funding-full-round50
          PYTHONPATH=research/altcoin-round27-premium python research/altcoin-round50-funding-full/run.py \
            --output artifacts/funding-full-round50 \
            --cache .cache/binance-funding-full-round50 \
            --workers 32
          cp research/altcoin-round50-funding-full/run.py artifacts/funding-full-round50/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-full-round50-results
          path: artifacts/funding-full-round50
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
