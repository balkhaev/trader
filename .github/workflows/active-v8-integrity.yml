name: Active V8 public integrity

on:
  push:
    branches:
      - agent/active-v8-integrity
    paths:
      - "research/active_v8_integrity/**"
      - ".github/workflows/active-v8-integrity.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/active_v8_integrity/**"
      - ".github/workflows/active-v8-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/active_v8_integrity/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/active_v8_integrity/requirements.txt

      - name: Compile source
        run: python -m py_compile research/active_v8_integrity/*.py

      - name: Run deterministic no-look-ahead self-test
        run: python research/active_v8_integrity/self_test.py
