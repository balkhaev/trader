name: Active V28 public integrity

on:
  push:
    branches: [agent/active-v28-integrity]
    paths:
      - "research/active_v28_integrity/**"
      - ".github/workflows/active-v28-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v28_integrity/**"
      - ".github/workflows/active-v28-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bundle bytes and hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('research/active_v28_integrity');m=json.loads((r/'manifest.json').read_text());b=(r/'bundle.b64').read_bytes()
          assert len(b)==m['encoded_bytes'],(len(b),m['encoded_bytes'])
          assert hashlib.sha256(b).hexdigest()==m['encoded_sha256'],hashlib.sha256(b).hexdigest()
          print(len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: Reconstruct and compile source
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,py_compile,tarfile,tempfile
          from pathlib import Path
          r=Path('research/active_v28_integrity');m=json.loads((r/'manifest.json').read_text());raw=base64.b64decode((r/'bundle.b64').read_bytes(),validate=True)
          assert len(raw)==m['archive_bytes'];assert hashlib.sha256(raw).hexdigest()==m['archive_sha256']
          with tempfile.TemporaryDirectory() as td:
            td=Path(td)
            with tarfile.open(fileobj=io.BytesIO(raw),mode='r:bz2') as tf:
              assert all(not Path(x.name).is_absolute() and '..' not in Path(x.name).parts for x in tf.getmembers());tf.extractall(td,filter='data')
            src=list(td.rglob('*.py'));assert len(src)>=8,len(src)
            for p in src:py_compile.compile(str(p),doraise=True)
            print('compiled',len(src))
          PY
      - name: Verify frozen decisions and metrics
        run: |
          python - <<'PY'
          import base64,io,json,tarfile,tempfile
          from pathlib import Path
          r=Path('research/active_v28_integrity');raw=base64.b64decode((r/'bundle.b64').read_bytes(),validate=True)
          with tempfile.TemporaryDirectory() as td:
            td=Path(td)
            with tarfile.open(fileobj=io.BytesIO(raw),mode='r:bz2') as tf:tf.extractall(td,filter='data')
            s=json.loads(next(td.rglob('summary.json')).read_text());f=json.loads(next(td.rglob('frozen_candidate.json')).read_text())
            assert s['status']=='frozen_paper_forward_candidate'
            assert all(s['acceptance_checks'].values())
            assert s['stress_full']['annualized_return']>.30 and s['stress_full']['max_drawdown']>-.30
            assert s['funding_audits']['fund60']['full_cagr']>.29
            assert s['funding_audits']['fund80_margin125']['final_return']>0
            assert f['candidate']=='ACTIVE_V28_EXACT8H_BREAKOUT_CARRY_CASH'
            assert f['target_gross_cap']==.85 and f['selection_excludes_2026h1'] is True
            print('frozen decisions passed')
          PY
