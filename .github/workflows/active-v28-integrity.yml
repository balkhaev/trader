name: Active V28 public integrity

on:
  push:
    branches: [agent/active-v28-integrity]
    paths:
      - "research/active_v28_integrity/**"
      - ".github/workflows/active-v28-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v28_integrity/**"
      - ".github/workflows/active-v28-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact private-source identity, compile and frozen decisions
        run: python research/active_v28_integrity/verify.py
