name: One-time production preparation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-production-once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Switch active web clients to same-origin API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'const API_URL = process.env.NEXT_PUBLIC_API_URL || "http://localhost:3000";'
          new = 'const API_URL = process.env.NEXT_PUBLIC_API_URL ?? "";'
          paths = [
              Path('apps/web/src/hooks/use-auto-trading.ts'),
              Path('apps/web/src/hooks/use-exchange.ts'),
              Path('apps/web/src/hooks/use-signals.ts'),
              Path('apps/web/src/hooks/use-strategy.ts'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected API URL declaration in {path}')
              path.write_text(text.replace(old, new))

          Path('apps/web/src/lib/auth-client.ts').write_text(
              'import { createAuthClient } from "better-auth/react";\n\n'
              'export const authClient = createAuthClient();\n'
          )

          Path('apps/web/next.config.ts').write_text(
              'import type { NextConfig } from "next";\n\n'
              'const apiInternalUrl = process.env.API_INTERNAL_URL ?? "http://localhost:3000";\n\n'
              'const nextConfig: NextConfig = {\n'
              '  typedRoutes: true,\n'
              '  reactCompiler: true,\n'
              '  async rewrites() {\n'
              '    return [\n'
              '      {\n'
              '        source: "/api/:path*",\n'
              '        destination: `${apiInternalUrl}/api/:path*`,\n'
              '      },\n'
              '    ];\n'
              '  },\n'
              '};\n\n'
              'export default nextConfig;\n'
          )
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/same-origin-report.json <<JSON
          {
            "completed": true,
            "mainSha": "${GITHUB_SHA}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/same-origin-report.json
          git commit -m "Use same-origin API routing in production"
          git push origin HEAD:main
