name: Active research v4 compute

on:
  push:
    branches:
      - agent/active-v4-compute
    paths:
      - "research/active_v4_compute/**"
      - ".github/workflows/active-v4-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance_v4
          key: binance-spot-daily-btc-eth-2018-2026-v4

      - name: Reconstruct and verify source
        run: python research/active_v4_compute/bootstrap.py --extract-only

      - name: Install dependencies
        run: python -m pip install -r research/active_v4_compute/generated/requirements.txt

      - name: Run deterministic self-test
        run: python research/active_v4_compute/bootstrap.py --self-test

      - name: Run full Active V4 research
        run: |
          python research/active_v4_compute/bootstrap.py \
            --output artifacts/active_v4 \
            --cache .cache/binance_v4
          mkdir -p artifacts/active_v4/source
          cp research/active_v4_compute/generated/*.py artifacts/active_v4/source/
          cp research/active_v4_compute/generated/requirements.txt artifacts/active_v4/source/
          cp research/active_v4_compute/manifest.json artifacts/active_v4/source_payload_manifest.json

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-research-v4-compute
          path: artifacts/active_v4
          if-no-files-found: warn
          retention-days: 30
