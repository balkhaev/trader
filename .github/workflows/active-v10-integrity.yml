name: Active V10 public integrity
on:
  push:
    branches: [agent/active-v10-integrity]
    paths:
      - "research/active_v10_integrity/**"
      - ".github/workflows/active-v10-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v10_integrity/**"
      - ".github/workflows/active-v10-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5
      - run: python -m py_compile research/active_v10_integrity/integrity_check.py
      - run: python research/active_v10_integrity/integrity_check.py
