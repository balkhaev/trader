name: Altcoin funding history round 45

on:
  pull_request:
    paths:
      - "research/altcoin-round45-funding-history/**"
      - ".github/workflows/altcoin-funding-history-round45.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-funding-history-round45
          key: funding-history-round45-usdm-2024-2025h1-v1
      - name: Compile and run fixed historical funding replay
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round41-funding-carry/run.py research/altcoin-round45-funding-history/run_history.py
          rm -rf artifacts/altcoin-round45-funding-history
          mkdir -p artifacts/altcoin-round45-funding-history
          PYTHONPATH=research/altcoin-round27-premium python research/altcoin-round45-funding-history/run_history.py \
            --output artifacts/altcoin-round45-funding-history \
            --cache .cache/binance-funding-history-round45 \
            --workers 32
          cp research/altcoin-round45-funding-history/run_history.py artifacts/altcoin-round45-funding-history/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round45-funding-history-results
          path: artifacts/altcoin-round45-funding-history
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
