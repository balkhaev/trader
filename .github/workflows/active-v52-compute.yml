name: Active V52 diversified onchain compute

on:
  push:
    branches: [agent/active-v52-onchain-diversification]
    paths:
      - "research/active_v52_compute/**"
      - ".github/workflows/active-v52-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v52_compute/**"
      - ".github/workflows/active-v52-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      V44_COMMIT: c96d10fe46ef5668514f1279db17941dade931c4
      V49_COMMIT: 123c8a8715d3631700f43d071576d3078686bb74
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned market and onchain cache
        uses: actions/cache@v4
        with:
          path: .cache/v44
          key: v44-coinmetrics-f1a36a-binance-btc-2015-2026-v1
      - name: Fetch and verify frozen V44 V46 V49 dependencies
        run: |
          set -euxo pipefail
          raw=https://raw.githubusercontent.com/balkhaev/trader
          mkdir -p research/active_v44_compute/payload research/active_v46_compute research/active_v49_compute
          curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/bootstrap.py" -o research/active_v44_compute/bootstrap.py
          curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/manifest.json" -o research/active_v44_compute/manifest.json
          for i in $(seq 0 12); do
            n=$(printf '%03d' "$i")
            curl -fL "$raw/$V44_COMMIT/research/active_v44_compute/payload/chunk_$n" -o "research/active_v44_compute/payload/chunk_$n"
          done
          curl -fL "$raw/$V44_COMMIT/research/active_v46_compute/run_v46.py" -o research/active_v46_compute/run_v46.py
          for n in 000 001 002; do
            curl -fL "$raw/$V49_COMMIT/research/active_v49_compute/part_$n.pyfrag" -o "research/active_v49_compute/part_$n.pyfrag"
          done
          python research/active_v44_compute/bootstrap.py --extract-only
          cat research/active_v49_compute/part_*.pyfrag > research/active_v49_compute/run_v49.py
          echo "c805f03f8ad10c52a8a6ec781ed8557eca1510e27af43aef6ec46fb366130f04  research/active_v46_compute/run_v46.py" | sha256sum -c -
          echo "3e0e1693133b153fd4b7903b0f3cf2bc14a48f45b86cf7583647c2101300c8e3  research/active_v49_compute/run_v49.py" | sha256sum -c -
      - name: Reconstruct verify and patch V52 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('research/active_v52_compute')
          raw = b''.join(p.read_bytes() for p in sorted(root.glob('part_*.pyfrag')))
          assert hashlib.sha256(raw).hexdigest() == '6f82549dec4d993ce915cc0edafd288a753c339c8fa820287bdf76c006a49667'
          old = b'dataset, quality, manifest = load(cfg, args.cache)'
          new = b'dataset, manifest, quality = load(cfg, args.cache)'
          assert raw.count(old) == 1
          patched = raw.replace(old, new)
          assert hashlib.sha256(patched).hexdigest() == '1aad138e8f4fa59262611555c4bd0be62c55c2c5ef8ee11eba8ed87dd60ead81'
          (root / 'run_v52.py').write_bytes(patched)
          PY
          python -m py_compile research/active_v44_compute/generated/*.py research/active_v46_compute/run_v46.py research/active_v49_compute/run_v49.py research/active_v52_compute/run_v52.py
      - name: Install dependencies
        run: python -m pip install -r research/active_v44_compute/generated/requirements.txt
      - name: Run deterministic V52 self-test
        run: python research/active_v52_compute/run_v52.py --self-test
      - name: Run full Active V52 research
        id: research
        continue-on-error: true
        run: |
          mkdir -p artifacts/active_v52
          set -o pipefail
          python research/active_v52_compute/run_v52.py \
            --v44-source research/active_v44_compute/generated \
            --v46-source research/active_v46_compute/run_v46.py \
            --v49-source research/active_v49_compute/run_v49.py \
            --cache .cache/v44 \
            --output artifacts/active_v52 \
            2>&1 | tee artifacts/active_v52/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/active_v52/run_exit_code.txt
          exit "$code"
      - name: Preserve exact source and provenance
        if: always()
        run: |
          mkdir -p artifacts/active_v52/source
          cp research/active_v52_compute/run_v52.py artifacts/active_v52/source/ || true
          cp research/active_v49_compute/run_v49.py artifacts/active_v52/source/ || true
          cp research/active_v46_compute/run_v46.py artifacts/active_v52/source/ || true
          cp -r research/active_v44_compute/generated artifacts/active_v52/source/v44 || true
          echo "${{ steps.research.outcome }}" > artifacts/active_v52/workflow_research_outcome.txt
          echo "${{ github.sha }}" > artifacts/active_v52/compute_commit.txt
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v52-diversified-onchain
          path: artifacts/active_v52
          if-no-files-found: warn
          retention-days: 30
