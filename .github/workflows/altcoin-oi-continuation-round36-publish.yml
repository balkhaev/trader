name: Altcoin OI continuation round 36 publish

on:
  pull_request:
    paths:
      - ".github/workflows/altcoin-oi-continuation-round36-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/altcoin-oi-continuation-round36-main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round36
          key: altcoin-round36-oi-continuation-20coins-v1

      - name: Compile and run
        run: |
          python -m py_compile research/altcoin-round28-confluence/run.py
          python -m py_compile research/altcoin-round36-oi-continuation/run.py
          rm -rf /tmp/altcoin-round36
          mkdir -p /tmp/altcoin-round36
          python research/altcoin-round36-oi-continuation/run.py \
            --output /tmp/altcoin-round36 \
            --cache .cache/binance-altcoin-round36 \
            --workers 32

      - name: Publish compact results
        run: |
          rm -rf research/altcoin-round36-oi-continuation/results
          mkdir -p research/altcoin-round36-oi-continuation/results
          for name in SUMMARY.json REPORT_RU.md SELECTION_BEFORE_JULY.csv ALL_CONFIG_RESULTS.csv ACCOUNT_SCENARIOS.csv FIXED_JULY_TRADES.csv; do
            if [ -f "/tmp/altcoin-round36/$name" ]; then
              cp "/tmp/altcoin-round36/$name" "research/altcoin-round36-oi-continuation/results/$name"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/altcoin-round36-oi-continuation/results
          git diff --cached --quiet || git commit -m "Publish OI continuation results [skip ci]"
          git push origin HEAD:agent/altcoin-oi-continuation-round36-main

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round36-oi-continuation-published-results
          path: /tmp/altcoin-round36
          if-no-files-found: error
          retention-days: 7
