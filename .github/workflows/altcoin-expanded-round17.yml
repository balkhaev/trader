name: Altcoin expanded exhaustion round 17

on:
  pull_request:
    paths:
      - "research/altcoin-round17-expanded/**"
      - ".github/workflows/altcoin-expanded-round17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"

      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round17
          key: altcoin-round17-usdm-15m-2025h2-2026july-v1

      - name: Decode and verify runner
        run: |
          cat research/altcoin-round17-expanded/payload/chunk_*.b64 | base64 --decode > /tmp/round17.tgz
          echo "5ed53f4baaeaf22003d44efd7cdbab1c4fa3988d5a0f21d8480f7c436f8ba48d  /tmp/round17.tgz" | sha256sum -c -
          rm -rf /tmp/round17
          mkdir -p /tmp/round17
          tar -xzf /tmp/round17.tgz -C /tmp/round17
          python -m py_compile /tmp/round17/*.py

      - name: Run expanded official USD-M search
        run: |
          rm -rf artifacts/altcoin-round17-expanded
          mkdir -p artifacts/altcoin-round17-expanded
          PYTHONPATH=/tmp/round17 python /tmp/round17/run.py \
            --output artifacts/altcoin-round17-expanded \
            --cache .cache/binance-altcoin-round17 \
            --workers 24
          cp -r /tmp/round17 artifacts/altcoin-round17-expanded/source

      - name: Upload complete research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round17-expanded-results
          path: artifacts/altcoin-round17-expanded
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
