name: Altcoin fixed funding carry round 44

on:
  pull_request:
    paths:
      - "research/altcoin-round44-funding-fixed/**"
      - ".github/workflows/altcoin-funding-fixed-round44.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round27
          key: altcoin-round27-usdm-premium-funding-2025h2-2026july-v1
      - name: Compile and run detailed fixed funding carry
        run: |
          python -m py_compile research/altcoin-round27-premium/*.py research/altcoin-round41-funding-carry/run.py research/altcoin-round44-funding-fixed/run_detailed.py
          rm -rf artifacts/altcoin-round44-funding-fixed
          mkdir -p artifacts/altcoin-round44-funding-fixed
          PYTHONPATH=research/altcoin-round27-premium python research/altcoin-round44-funding-fixed/run_detailed.py \
            --output artifacts/altcoin-round44-funding-fixed \
            --cache .cache/binance-altcoin-round27 \
            --workers 24
          cp research/altcoin-round44-funding-fixed/run_detailed.py artifacts/altcoin-round44-funding-fixed/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round44-funding-fixed-results
          path: artifacts/altcoin-round44-funding-fixed
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
