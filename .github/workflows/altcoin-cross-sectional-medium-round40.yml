name: Altcoin medium cross-sectional round 40

on:
  pull_request:
    paths:
      - "research/altcoin-round40-cross-sectional/**"
      - ".github/workflows/altcoin-cross-sectional-medium-round40.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore verified Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round17
          key: altcoin-round17-usdm-15m-2025h2-2026july-v1
      - name: Decode shared source, freeze 30-symbol universe and compile
        run: |
          cat research/altcoin-round17-expanded/payload/chunk_*.b64 | base64 --decode > /tmp/round17.tgz
          echo "5ed53f4baaeaf22003d44efd7cdbab1c4fa3988d5a0f21d8480f7c436f8ba48d  /tmp/round17.tgz" | sha256sum -c -
          rm -rf /tmp/round17
          mkdir -p /tmp/round17
          tar -xzf /tmp/round17.tgz -C /tmp/round17
          python - <<'PY'
          from pathlib import Path
          p=Path('research/altcoin-round40-cross-sectional/run.py')
          s=p.read_text()
          old='from config import CUT, JULY_END, PRE_JULY_END, START, SYMBOLS\n'
          universe=['SOLUSDT','BNBUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','LINKUSDT','DOTUSDT','LTCUSDT','BCHUSDT','TRXUSDT','ETCUSDT','NEARUSDT','ATOMUSDT','APTUSDT','ARBUSDT','OPUSDT','SUIUSDT','INJUSDT','TIAUSDT','SEIUSDT','AAVEUSDT','UNIUSDT','FILUSDT','WLDUSDT','1000PEPEUSDT','1000BONKUSDT','1000SHIBUSDT','STXUSDT','ICPUSDT']
          new='from config import CUT, JULY_END, PRE_JULY_END, START\nSYMBOLS = '+repr(universe)+'\n'
          if old not in s:
              raise SystemExit('config import block not found')
          s=s.replace(old,new)
          s=s.replace('(x.market_count>=40)', '(x.market_count>=24)')
          p.write_text(s)
          PY
          python -m py_compile /tmp/round17/*.py research/altcoin-round40-cross-sectional/run.py
      - name: Run medium-horizon cross-sectional research
        shell: bash
        run: |
          set -o pipefail
          rm -rf artifacts/altcoin-round40-cross-sectional
          mkdir -p artifacts/altcoin-round40-cross-sectional
          PYTHONPATH=/tmp/round17 python research/altcoin-round40-cross-sectional/run.py \
            --output artifacts/altcoin-round40-cross-sectional \
            --cache .cache/binance-altcoin-round17 \
            --workers 24 2>&1 | tee artifacts/altcoin-round40-cross-sectional/run.log
          cp research/altcoin-round40-cross-sectional/run.py artifacts/altcoin-round40-cross-sectional/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round40-cross-sectional-results
          path: artifacts/altcoin-round40-cross-sectional
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
