name: Altcoin microstructure round 39

on:
  pull_request:
    paths:
      - "research/altcoin-round39-microstructure/**"
      - ".github/workflows/altcoin-microstructure-round39.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      PANDAS_COPY_ON_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "requests>=2.32,<3" "tabulate>=0.9,<1"
      - name: Restore archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-altcoin-round39
          key: altcoin-round39-usdm-1m-2025h2-2026july-v1
      - name: Patch current Binance kline header aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/altcoin-round39-microstructure/run.py')
          s=p.read_text()
          old='''    if header: df.columns=[str(c).strip().lower().replace(" ","_") for c in df.columns]\n    else: df=df.iloc[:,:12]; df.columns=COLS[:df.shape[1]]\n    for col in COLS:\n'''
          new='''    if header:\n        df.columns=[str(c).strip().lower().replace(" ","_") for c in df.columns]\n        aliases={\n            "count":"trades",\n            "number_of_trades":"trades",\n            "taker_buy_volume":"taker_buy_base",\n            "taker_buy_base_asset_volume":"taker_buy_base",\n            "taker_buy_quote_volume":"taker_buy_quote",\n            "taker_buy_quote_asset_volume":"taker_buy_quote",\n            "quote_asset_volume":"quote_volume",\n        }\n        df=df.rename(columns={k:v for k,v in aliases.items() if k in df.columns})\n    else: df=df.iloc[:,:12]; df.columns=COLS[:df.shape[1]]\n    for col in COLS:\n'''
          if old not in s:
              raise SystemExit('header parser block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Compile and run microstructure research
        run: |
          python -m py_compile research/altcoin-round39-microstructure/run.py
          rm -rf artifacts/altcoin-round39-microstructure
          mkdir -p artifacts/altcoin-round39-microstructure
          python research/altcoin-round39-microstructure/run.py \
            --output artifacts/altcoin-round39-microstructure \
            --cache .cache/binance-altcoin-round39 \
            --workers 32
          cp research/altcoin-round39-microstructure/run.py artifacts/altcoin-round39-microstructure/
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-round39-microstructure-results
          path: artifacts/altcoin-round39-microstructure
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
