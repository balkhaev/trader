name: Active V34 funding contrarian compute

on:
  push:
    branches: [agent/active-v33-multiasset-carry]
    paths:
      - "research/active_v34_compute/**"
      - ".github/workflows/active-v34-compute.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/active_v34_compute/**"
      - ".github/workflows/active-v34-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore V33 Binance cache
        uses: actions/cache@v4
        with:
          path: .cache/v33
          key: binance-v33-fixed-universe-8h-2020-2026
      - name: Reconstruct shared source
        run: python research/active_v33_compute/bootstrap.py --extract-only
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 numba==0.65.1
      - name: Reconstruct and verify V34
        run: |
          cat research/active_v34_compute/script_part_*.pyfrag > research/active_v33_compute/run_v34.py
          echo "0561ef250779a77297e607512b5fbc12d3b0fb97c9f337ed2958ffd133e6c03e  research/active_v33_compute/run_v34.py" | sha256sum -c -
          python -m py_compile research/active_v33_compute/run_v34.py
      - name: Run Active V34 research
        working-directory: research/active_v33_compute
        run: python run_v34.py --cache ../../.cache/v33 --output ../../artifacts/active_v34
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-v34-funding-contrarian
          path: artifacts/active_v34
          if-no-files-found: warn
          retention-days: 30
